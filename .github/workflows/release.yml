# Release automation: pushing a `v*` tag publishes to npm and opens a GitHub
# Release.
#
# The publish path is `scripts/publish-release.mjs`, which is also runnable locally
# (`node scripts/publish-release.mjs --dry-run`), so what CI does is reviewable and
# testable without pushing a tag. It refuses a tag that disagrees with
# `package.json`, and treats an already-published version as success — so a re-run
# converges instead of failing. That idempotence is deliberate: a publish that
# half-succeeds (the registry records the version, the client sees an error) makes
# the version number permanently unusable, which is what happened to 0.2.0 before
# this workflow existed.
#
# Authentication is **trusted publishing**, not a stored secret: npm swaps a
# short-lived OIDC token minted by the runner (the `id-token: write` permission
# below) for a one-shot publish credential, and records a provenance attestation
# alongside it. There is no long-lived token in this repository to leak and none
# to rotate — the previous NPM_TOKEN secret was removed after it expired and broke
# a release in the middle of one. The npm side trusts this repository and this
# workflow *file name* (npm → package → Settings → Trusted publishing), so
# renaming or moving release.yml means updating that entry in the same change.
name: Release

on:
  push:
    tags: ['v*']
  # Validates the pipeline without publishing: a branch ref makes
  # publish-release.mjs report the credential state and exit 0, and the Release
  # step below is guarded to real version tags only. Retrying a failed *tag* run is
  # also safe, because every step is idempotent.
  workflow_dispatch:

# `contents: write` is needed to create the Release. `id-token: write` is what
# lets the runner mint the OIDC token that trusted publishing exchanges for a
# publish credential; without it `npm publish` has no authentication at all, which
# fails with a bare 404/401 from the registry. Both are granted to this workflow
# file only, and fork pull requests never run it (tag pushes cannot come from a
# fork).
permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: publish to npm and release
    # Ubuntu, not Windows: this job needs no platform-specific behaviour, and the
    # gate itself is already verified on both runners in CI.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # `publish-release.mjs` reads the tag on HEAD when it is not given one.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          # No `registry-url`: that option writes `_authToken=${NODE_AUTH_TOKEN}`
          # into .npmrc, and with trusted publishing there is no token to
          # substitute. npm already defaults to the public registry, and the
          # credential arrives through the OIDC exchange at publish time.

      - name: Ensure npm supports trusted publishing
        # The OIDC exchange needs npm >= 11.5.1. Node 24 ships an 11.x that
        # qualifies today, but the patch version follows the runner image, so the
        # floor is stated here instead of inherited from whatever the image has.
        run: |
          npm install -g 'npm@^11.5.1'
          npm --version

      - name: Install dev dependencies
        run: pnpm install --frozen-lockfile

      # Job logs are not readable without a token, so a failed publish republishes
      # the tail of its own log as a check-run annotation, and names the
      # trusted-publisher misconfiguration behind the one 403 that looks like an
      # identity mismatch but is a permission one.
      # The script runs `npm publish`, whose `prepack` is the full release gate
      # (11 steps: typecheck, build, artifact check, probe, five suites, the HTTP
      # surface suite, lifecycle, demo). Nothing is published if it fails.
      - name: Publish
        # No NODE_AUTH_TOKEN: `npm publish` detects the trusted-publishing
        # environment itself and trades the job's OIDC token for a credential
        # that expires when the job ends.
        run: |
          set -o pipefail
          node scripts/publish-release.mjs --tag "$GITHUB_REF_NAME" 2>&1 | tee "$RUNNER_TEMP/publish.log"

      - name: Surface the publish failure
        if: failure()
        run: |
          node -e 'const fs=require("node:fs");const p=process.env.RUNNER_TEMP+"/publish.log";if(!fs.existsSync(p))process.exit(0);const t=fs.readFileSync(p,"utf8").trimEnd();const tail=t.slice(-700);console.log("::error title=publish-release::"+encodeURIComponent(tail));if(/OIDC permission denied/i.test(t))console.log("::error title=trusted publisher::The allowed actions for this trusted publisher do not include a direct npm publish (since 2026-09-03 a new connection allows staged publishing only). Tick \"npm publish\" under Allowed actions on npmjs.com; a connection whose fields are frozen has to be deleted and recreated.");'

      - name: Compose the release body from CHANGELOG.md
        # The section for this version is the body. `generate_release_notes` would
        # list commits instead, which is how v0.3.0 first shipped with a page whose
        # only content was "Full Changelog": the actual changes (a GUI panel, a
        # silent-skip fix) were invisible. The script falls back to a labelled
        # commit summary when a version has no section, so the page is never empty.
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/release-notes.mjs --tag "$GITHUB_REF_NAME" --out "$RUNNER_TEMP/release-notes.md"

      - name: Create the GitHub Release
        # Only a real version tag may open a Release. Without this guard the
        # manual validation run would ask action-gh-release for tag `main`, which
        # does not exist, and the action *creates* it — one dispatch produced a
        # stray `main` release and tag that then had to be deleted by hand.
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: ${{ runner.temp }}/release-notes.md
          # The tarball `scripts/publish-release.mjs` packed (npm's own filename,
          # e.g. ray1270-dsh-task-stack-0.2.0.tgz), so a release page can be checked
          # against the registry without downloading from npm.
          files: '*.tgz'
