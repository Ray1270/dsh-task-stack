# Continuous integration: the same release gate the publish path runs.
#
# `node scripts/release-check.mjs` is deliberate about not invoking a package
# manager: it drives tsc and every suite through `node` with `shell: false`, so a
# broken PATH on a runner cannot fail it for reasons unrelated to this package.
# The workflow therefore only has to provision Node and the dev dependencies.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only: the gate builds and tests, it never writes back to the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-check:
    name: release-check (${{ matrix.os }} / node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The package targets ^22.19.0 || >=24.0.0 (see package.json engines).
        #
        # Windows only for now: the gate is developed and verified there, and
        # neither WSL nor Docker was available to prove the suites on Linux.
        # Adding a leg that has never run is how a first CI run goes red for a
        # reason nobody has evidence about. Uncomment `include` entries below once
        # they have passed once (push to a branch and read the run), which also
        # exercises the two path/separator assumptions most worth checking:
        # temp-dir prefixes in the suites, and the profile-path constant in
        # scripts/ (both already use path.join/normalize rather than literals).
        include:
          - os: windows-latest
            node: '24'
        #  - os: ubuntu-latest
        #    node: '24'
        #  - os: ubuntu-latest
        #    node: '22.19.0'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      # The committed lockfile is the contract; CI must not silently re-resolve
      # (verified locally: `pnpm install --frozen-lockfile` reports up to date).
      - name: Install dev dependencies
        run: pnpm install --frozen-lockfile

      # One gate, ten steps: typecheck, build, artifact check, probe, five
      # suites, demo. It exits non-zero with the failing step's own output.
      - name: Release gate
        run: node scripts/release-check.mjs

      # A publish must never ship a tree that does not build from a clean clone.
      - name: Verify the package tarball
        run: npm pack --dry-run
